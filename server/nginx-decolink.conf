# nginx per il servizio di accesso di Decolink.
#
#   sudo cp nginx-decolink.conf /etc/nginx/sites-available/decolink.ft2.it
#   sudo ln -s /etc/nginx/sites-available/decolink.ft2.it /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d decolink.ft2.it
#
# Il blocco qui sotto e' in HTTP: ci pensa certbot ad aggiungere il blocco 443
# con il certificato e a dirottare il traffico in chiaro su HTTPS. Si parte da
# HTTP perche' certbot deve poter rispondere alla verifica del dominio, che
# avviene sulla porta 80.
#
# La porta a cui si inoltra (8090) deve corrispondere a quella con cui gira
# decolink_web.py: su questa macchina la 8080 e' gia' occupata da un'altra
# applicazione.

server {
    listen 80;
    listen [::]:80;
    server_name decolink.ft2.it;

    # Le password passano di qui: nessuna cache e nessuna cornice altrui.
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Serve al freno sui tentativi di login: senza, dietro al proxy tutti
        # avrebbero lo stesso indirizzo (127.0.0.1) e il limite varrebbe per
        # l'intero mondo invece che per chi bussa.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
